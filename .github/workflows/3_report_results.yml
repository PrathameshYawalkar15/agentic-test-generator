name: 3️⃣ Generate Test Reports

on:
  workflow_run:
    workflows: ["2️⃣ Execute Generated Tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  generate_report:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # github.event.workflow_run.id here is workflow 2's run id.
      # "test-results" was uploaded by workflow 2 itself, so this works
      # directly. "generation-report" originally came from workflow 1,
      # but workflow 2 now re-uploads (forwards) it as its own artifact,
      # so it's reachable from workflow 2's run id too -- see the
      # "Forward generation report" step in 2_execute_tests.yml.
      - name: 📥 Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: 📥 Download generation report
        uses: actions/download-artifact@v4
        with:
          name: generation-report
          path: ./
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📊 Generate comprehensive report
        run: |
          python -c "
          import json
          import textwrap
          from datetime import datetime

          # Load generation result
          with open('generation_result.json') as f:
              gen_result = json.load(f)

          # Create comprehensive report. textwrap.dedent() strips the
          # common leading indentation below -- that indentation is only
          # there so this block is valid YAML (every line inside a
          # 'run: |' block scalar must share one indent level); without
          # dedent() it would end up baked into REPORT.md and Markdown
          # renderers would treat the whole thing as a code block.
          report = textwrap.dedent(f'''
          # 🤖 Agentic Test Generation Report
          Generated: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}

          ## Generation Results
          - **Requirements Processed**: {gen_result.get('processed', 0)}/{gen_result.get('total', 0)}
          - **Scenarios Generated**: {gen_result.get('total_scenarios', 0)}
          - **Status**: {'✅ Success' if gen_result.get('success') else '❌ Failed'}

          ## Test Execution
          - See artifacts for detailed test reports
          - HTML Report: test_report.html
          - Allure Report: allure-results/

          ## Next Steps
          1. Review generated test cases in features/ directory
          2. Check test results in artifacts
          3. Implement step definitions for your specific domain

          ---
          Generated by Agentic Test Generator
          ''')

          with open('REPORT.md', 'w') as f:
              f.write(report)

          print(report)
          "

      - name: 📤 Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: REPORT.md

      - name: 📝 Add to summary
        run: |
          cat REPORT.md >> $GITHUB_STEP_SUMMARY

      - name: 🔔 Create issue with results
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('REPORT.md', 'utf8');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Test Generation Report - ' + new Date().toLocaleDateString(),
              body: report
            });
