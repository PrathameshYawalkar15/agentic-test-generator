name: 🚀 Complete CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'requirements/**'
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * MON'  # Weekly on Monday
  workflow_dispatch:
    inputs:
      condition_types:
        description: >
          Comma-separated condition types to generate
          (threshold, boundary, timing, state, error, recovery),
          or "all" for every type.
        required: false
        default: 'all'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'
  REGISTRY: ghcr.io

jobs:
  # Stage 1: Generate Tests
  generate:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.gen.outputs.scenarios }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Ollama
        # Non-fatal: nothing in the "Generate tests" step below actually
        # calls Ollama yet (see 1_generate_tests.yml for the same note).
        continue-on-error: true
        run: |
          docker run -d --name ollama -p 11434:11434 ollama/ollama serve
          sleep 10
          docker exec ollama ollama pull mistral:7b
          docker exec ollama ollama pull nomic-embed-text

      - name: Generate tests
        id: gen
        env:
          CONDITION_TYPES: ${{ github.event.inputs.condition_types || 'all' }}
        run: |
          python -c "
          import os, json
          from src.orchestrator import TestOrchestrator

          raw_types = os.environ.get('CONDITION_TYPES', 'all').strip()
          condition_types = (
              None if not raw_types or raw_types.lower() == 'all'
              else [t.strip() for t in raw_types.split(',') if t.strip()]
          )

          orch = TestOrchestrator()
          result = orch.process_all_requirements(condition_types)

          with open('generation_result.json', 'w') as f:
              json.dump(result, f)

          # ::set-output:: was deprecated and removed by GitHub; write to
          # \$GITHUB_OUTPUT instead.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
              gh_out.write(f'scenarios={result[\"total_scenarios\"]}\n')

          if not result['success']:
              exit(1)
          "

      - name: Upload features
        uses: actions/upload-artifact@v4
        with:
          name: features
          path: features/

  # Stage 2: Execute Tests
  execute:
    needs: generate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Same workflow run as the "generate" job (via needs:), so no
      # run-id/github-token is required here -- that's only needed when
      # crossing between separate workflow runs, as in
      # 2_execute_tests.yml / 3_report_results.yml.
      - name: Download features
        uses: actions/download-artifact@v4
        with:
          name: features
          path: features/

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate step definitions
        run: |
          mkdir -p step_definitions
          python src/generate_steps.py

      - name: Run tests
        run: |
          pytest features/ \
            --html=reports/report.html \
            --self-contained-html \
            -v || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/

  # Stage 3: Quality Checks
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          pip install flake8 pylint black isort

      - name: Check code style
        run: |
          black --check src/ || true
          isort --check-only src/ || true

      - name: Run pylint
        run: pylint src/ --fail-under=8.0 || true

      - name: Run flake8
        run: flake8 src/ || true

  # Stage 4: Docker Build (Optional)
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ghcr.io (and OCI registries generally) require lowercase
      # repository names, but github.repository keeps your actual
      # GitHub username/org casing (e.g. "PrathameshYawalkar15/...").
      # There's no lower() function in GitHub Actions expression syntax,
      # so this is computed with bash's ${VAR,,} lowercase expansion and
      # exported for the tag below to use.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Final: Notify
  notify:
    needs: [generate, execute, quality]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## 🚀 CI/CD Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Generate: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Execute: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Quality: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: ✅" >> $GITHUB_STEP_SUMMARY
